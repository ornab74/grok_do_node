name: grok-patched-node

x-patched-image: &patched-image
  image: ghcr.io/ornab74/chrome-patch-chromium@sha256:f212beff4487370a6c026a1834f779657e76c7091c6ae42b4d2cee8cfe42d2f3
  platform: linux/amd64

x-hardening: &hardening
  <<: *patched-image
  user: "10001:10001"
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt:
    - apparmor=chrome-patch-browser
    - seccomp=./docker/chromium-seccomp.json
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: 2g
  cpus: 2.0
  shm_size: 512m
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
    - /home/scraper:rw,nosuid,nodev,noexec,size=96m,uid=10001,gid=10001,mode=0700
  environment:
    PYTHONHASHSEED: "0"
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "2"

services:
  browser-audit:
    <<: *hardening
    network_mode: none
    command: ["python", "-m", "common.sandbox_probe"]

  egress-proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.proxy
    user: "13:13"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
    tmpfs:
      - /run/squid:rw,nosuid,nodev,noexec,size=8m,uid=13,gid=13
      - /var/spool/squid:rw,nosuid,nodev,noexec,size=16m,uid=13,gid=13
      - /var/log/squid:rw,nosuid,nodev,noexec,size=16m,uid=13,gid=13
      - /tmp:rw,nosuid,nodev,noexec,size=32m,uid=13,gid=13,mode=0700
    networks: [grok-internal, proxy-outbound]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 2s
      retries: 10

  grok-tui:
    <<: *hardening
    depends_on:
      egress-proxy:
        condition: service_healthy
    environment:
      PYTHONHASHSEED: "0"
      SCRAPER_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: 127.0.0.1,localhost
    networks: [grok-internal]
    stdin_open: true
    tty: true
    volumes:
      - ./grok_tui.py:/app/grok_tui.py:ro
    command: ["python", "/app/grok_tui.py"]

networks:
  # Browser/TUI has no direct default route to the Internet.
  grok-internal:
    internal: true
  # Only Squid joins this network.
  proxy-outbound: {}
