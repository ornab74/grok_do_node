name: Static security gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify source checksums
        run: sha256sum --check --strict SHA256SUMS

      - name: Check shell syntax
        run: bash -n install.sh chromium/build_chromium.sh scripts/*.sh

      - name: Validate runtime profiles
        run: python3 scripts/verify-runtime-profiles.py

      - name: Run local policy tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate Compose model
        run: docker compose config --quiet
