visible_hostname grok-patched-egress
http_port 3128
pid_filename /run/squid/squid.pid
coredump_dir /tmp

acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 443

# Intentionally narrow. Grok itself plus xAI/X authentication/static domains and
# Cloudflare's verification endpoint. Add domains only after reviewing why the
# page needs them; do not turn this into an unrestricted forward proxy.
acl approved_domains dstdomain \
    .grok.com \
    .x.ai \
    .x.com \
    .twimg.com \
    challenges.cloudflare.com

# Refuse destinations that could reach host/private/cloud metadata networks.
acl forbidden_destination dst \
    0.0.0.0/8 \
    10.0.0.0/8 \
    100.64.0.0/10 \
    127.0.0.0/8 \
    169.254.0.0/16 \
    172.16.0.0/12 \
    192.0.0.0/24 \
    192.0.2.0/24 \
    192.168.0.0/16 \
    198.18.0.0/15 \
    198.51.100.0/24 \
    203.0.113.0/24 \
    224.0.0.0/4 \
    240.0.0.0/4 \
    ::/128 \
    ::1/128 \
    fc00::/7 \
    fe80::/10

http_access deny forbidden_destination
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow approved_domains
http_access deny all

cache deny all
cache_dir null /tmp/squid-cache
access_log stdio:/dev/stdout
cache_log /dev/stderr
forwarded_for delete
via off
request_header_access Proxy-Authorization deny all
reply_header_access Server deny all
shutdown_lifetime 1 seconds
