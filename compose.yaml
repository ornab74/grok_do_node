name: grok-secure-node

x-vault-browser: &vault-browser
  image: grok-chrome-patch:151.0.7922.169-vault
  platform: linux/amd64
  user: "10001:10001"
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt:
    - apparmor=chrome-patch-browser
    - seccomp=./security/chromium-seccomp.json
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: 2g
  cpus: 2.0
  shm_size: 512m
  ulimits:
    core: 0
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=384m,uid=10001,gid=10001,mode=0700
    - /home/scraper:rw,nosuid,nodev,noexec,size=64m,uid=10001,gid=10001,mode=0700
    - /session:rw,nosuid,nodev,noexec,size=768m,uid=10001,gid=10001,mode=0700
  environment:
    PYTHONHASHSEED: "0"
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "2"

services:
  vault-init:
    image: debian:bookworm-slim
    user: "0:0"
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt:
      - no-new-privileges:true
    volumes:
      - grok-vault:/vault
    command: ["/bin/sh", "-ec", "mkdir -p /vault/profiles; chown -R 10001:10001 /vault; chmod 0700 /vault /vault/profiles"]

  browser-audit:
    <<: *vault-browser
    network_mode: none
    command: ["python", "-m", "common.sandbox_probe"]

  egress-proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.proxy
    user: "13:13"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
    tmpfs:
      - /run/squid:rw,nosuid,nodev,noexec,size=8m,uid=13,gid=13
      - /var/spool/squid:rw,nosuid,nodev,noexec,size=16m,uid=13,gid=13
      - /var/log/squid:rw,nosuid,nodev,noexec,size=16m,uid=13,gid=13
      - /tmp:rw,nosuid,nodev,noexec,size=32m,uid=13,gid=13,mode=0700
    networks: [grok-internal, proxy-outbound]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 2s
      retries: 10

  grok-tui:
    <<: *vault-browser
    depends_on:
      egress-proxy:
        condition: service_healthy
    environment:
      PYTHONHASHSEED: "0"
      SCRAPER_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: 127.0.0.1,localhost
      GROK_VAULT_DIR: /vault
      GROK_SESSION_ROOT: /session
    volumes:
      - grok-vault:/vault
    networks: [grok-internal]
    stdin_open: true
    tty: true
    command: ["python", "/app/grok_vault_tui.py"]

networks:
  grok-internal:
    internal: true
  proxy-outbound: {}

volumes:
  grok-vault:
    name: grok-secure-vault-v1
